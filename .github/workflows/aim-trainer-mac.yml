name: Aim Trainer Mac app

# Run by hand from the Actions tab (or `gh workflow run`). A Mac app can only be packaged on a Mac,
# so this does it on GitHub's, and publishes the .dmg files as a release with a direct download link.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: |
          npm ci
          npm ci --prefix desktop

      - name: Build the trainer page
        working-directory: desktop
        run: npm run build:web

      # One universal app that runs natively on both, so nobody picks the Intel one on an M-series Mac
      # and ends up on Rosetta.
      - name: Package for Apple Silicon and Intel
        working-directory: desktop
        run: npx electron-builder --mac dir --universal --publish never

      # No Apple Developer account, so an ad-hoc signature: Apple Silicon refuses to run an app with
      # none at all. Players still allow it once under Privacy & Security.
      - name: Sign ad-hoc and make the disk images
        working-directory: desktop
        run: |
          set -euo pipefail
          mkdir -p release
          app="dist/mac-universal/Kirka Hub Aim Trainer.app"
          lipo -archs "$app/Contents/MacOS/Kirka Hub Aim Trainer" | grep -q arm64
          lipo -archs "$app/Contents/MacOS/Kirka Hub Aim Trainer" | grep -q x86_64
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          # what the app's own updater downloads
          ditto -c -k --sequesterRsrc --keepParent "$app" release/Kirka-Hub-Aim-Trainer-mac.zip
          stage="$(mktemp -d)"
          ditto "$app" "$stage/Kirka Hub Aim Trainer.app"
          ln -s /Applications "$stage/Applications"
          out="release/Kirka-Hub-Aim-Trainer.dmg"
          for attempt in 1 2 3; do
            hdiutil create -volname "Kirka Hub Aim Trainer" -srcfolder "$stage" -ov -format UDZO "$out" && break
            sleep 5
          done
          test -f "$out"
          ls -lh release

      - name: Check the app starts
        working-directory: desktop
        run: |
          "dist/mac-universal/Kirka Hub Aim Trainer.app/Contents/MacOS/Kirka Hub Aim Trainer" &
          pid=$!
          sleep 15
          kill -0 "$pid"
          kill "$pid"

      - name: Publish
        working-directory: desktop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="aim-trainer-mac-v$(node -p "require('./package.json').version")"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/*.dmg release/*.zip --clobber
          else
            gh release create "$tag" release/*.dmg release/*.zip --latest=false --title "Aim Trainer for Mac" --notes "One file for every Mac: it runs natively on Apple Silicon (no Rosetta) and on Intel. The first time you open it, macOS will block it: go to System Settings, Privacy & Security, and choose Open Anyway. Keep it in Applications and it updates itself. If the game looks choppy, try Uncapped FPS or Screen refresh rate, and VSync on or off, from the Frame Rate menu in the menu bar."
          fi

      # A copy that thinks it's old has to download the release just published and swap itself out.
      - name: Check the app updates itself
        working-directory: desktop
        run: |
          set -euo pipefail
          dir="$HOME/UpdateTest"
          app="$dir/Kirka Hub Aim Trainer.app"
          rm -rf "$dir" && mkdir -p "$dir"
          ditto "dist/mac-universal/Kirka Hub Aim Trainer.app" "$app"
          touch "$app/Contents/old-copy"
          KIRKAHUB_UPDATE_TEST=1 "$app/Contents/MacOS/Kirka Hub Aim Trainer" &
          for i in $(seq 1 60); do
            sleep 2
            if [ -d "$app/Contents/MacOS" ] && [ ! -e "$app/Contents/old-copy" ] && [ ! -e "$app.old" ]; then
              echo "The app updated itself"
              pkill -f "Kirka Hub Aim Trainer" || true
              exit 0
            fi
          done
          echo "The app did not update itself"
          ls -la "$dir"
          exit 1
