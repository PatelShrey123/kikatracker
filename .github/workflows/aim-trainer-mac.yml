name: Aim Trainer Mac app

# Run by hand from the Actions tab (or `gh workflow run`). A Mac app can only be packaged on a Mac,
# so this does it on GitHub's, and publishes the .dmg files as a release with a direct download link.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: |
          npm ci
          npm ci --prefix desktop

      - name: Build the trainer page
        working-directory: desktop
        run: npm run build:web

      - name: Package for Apple Silicon and Intel
        working-directory: desktop
        run: npx electron-builder --mac dir --arm64 --x64 --publish never

      # No Apple Developer account, so an ad-hoc signature: Apple Silicon refuses to run an app with
      # none at all. Players still allow it once under Privacy & Security.
      - name: Sign ad-hoc and make the disk images
        working-directory: desktop
        run: |
          set -euo pipefail
          mkdir -p release
          for pair in mac-arm64:arm64 mac:x64; do
            folder="${pair%%:*}"
            arch="${pair##*:}"
            app="dist/$folder/Kirka Hub Aim Trainer.app"
            codesign --force --deep --sign - "$app"
            codesign --verify --deep --strict "$app"
            stage="$(mktemp -d)"
            ditto "$app" "$stage/Kirka Hub Aim Trainer.app"
            ln -s /Applications "$stage/Applications"
            out="release/Kirka-Hub-Aim-Trainer-$arch.dmg"
            for attempt in 1 2 3; do
              hdiutil create -volname "Kirka Hub Aim Trainer" -srcfolder "$stage" -ov -format UDZO "$out" && break
              sleep 5
            done
            test -f "$out"
          done
          ls -lh release

      - name: Check the app starts
        working-directory: desktop
        run: |
          "dist/mac-arm64/Kirka Hub Aim Trainer.app/Contents/MacOS/Kirka Hub Aim Trainer" &
          pid=$!
          sleep 15
          kill -0 "$pid"
          kill "$pid"

      - name: Publish
        working-directory: desktop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="aim-trainer-mac-v$(node -p "require('./package.json').version")"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/*.dmg --clobber
          else
            gh release create "$tag" release/*.dmg --latest=false --title "Aim Trainer for Mac" --notes "Apple Silicon (M1 and newer): the arm64 file. Older Intel Macs: the x64 file. The first time you open it, macOS will block it: go to System Settings, Privacy & Security, and choose Open Anyway."
          fi
