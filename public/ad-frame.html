<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <!-- Must match the site's dark scheme: Chrome paints a frame with a different scheme solid white -->
    <meta name="color-scheme" content="dark" />
    <title>Advertisement</title>
    <style>
      html, body { margin: 0; padding: 0; overflow: hidden; background: transparent; color-scheme: dark; }
      /* the native banner draws its own text: light on the site's dark background */
      body.native { color: #e2e8f0; font: 14px/1.35 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      body.native a { color: inherit; }
    </style>
  </head>
  <body>
    <!-- One Adsterra banner or native banner. Loaded in a sandboxed iframe by src/components/AdSlot.tsx, so the ad
         code can't read the site or redirect the page. -->
    <script>
      // Errors from the ad code are passed up to the page's console, prefixed [ad], to see why an ad is missing
      function report(message) {
        try { parent.postMessage({ khAdError: String(message).slice(0, 300) }, '*'); } catch (e) {}
      }
      window.addEventListener('error', function (e) { report(e.message || 'script error'); });
      window.addEventListener('unhandledrejection', function (e) { report(e.reason && e.reason.message ? e.reason.message : e.reason); });
      (function () {
        var units = {
          '728x90': { key: 'eb03325c0a652e4d6651aa2fa8bbaf67', width: 728, height: 90 },
          '320x50': { key: '3f65bda74b921cd3f16f9c4f9463c7d2', width: 320, height: 50 },
          '468x60': { key: '0641961419cefc03caf9f27a83901510', width: 468, height: 60 },
          '300x250': { key: 'a7a4bbe8aed6b5d128e738aae1b0d1d8', width: 300, height: 250 },
          '160x600': { key: '5cf27538efbf7a4e657fa0b916b0830f', width: 160, height: 600 },
          '160x300': { key: '1338f2a2661aff21b09ff3a91dd3dc46', width: 160, height: 300 },
        };
        var name = new URLSearchParams(location.search).get('unit');
        if (name === 'native') {
          // Native banner (4:1 layout, set in Adsterra). Its height depends on the ads it gets, so the
          // frame tells the page how tall it is.
          var key = 'cbcc8e1c1def05ce2d82a5850c27584d';
          document.body.className = 'native';
          document.write('<script async data-cfasync="false" src="https://bauval.org/21/' + key + '"><\/script><div id="container-' + key + '"><\/div>');
          var last = -1;
          var tell = function () {
            var h = document.documentElement.scrollHeight;
            if (h !== last) { last = h; try { parent.postMessage({ khAdHeight: h }, '*'); } catch (e) {} }
          };
          if (window.ResizeObserver) new ResizeObserver(tell).observe(document.body);
          setInterval(tell, 1000);
          return;
        }
        if (!Object.prototype.hasOwnProperty.call(units, name)) return;
        var unit = units[name];
        window.atOptions = { key: unit.key, format: 'iframe', height: unit.height, width: unit.width, params: {} };
        document.write('<script src="https://bauval.org/22/' + unit.key + '"><\/script>');
      })();
    </script>
  </body>
</html>
